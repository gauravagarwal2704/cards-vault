plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.cardswallet.cards_vault"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.cardswallet.cards_vault"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false

            packaging {
                jniLibs {
                    excludes += ['**/libVkLayer_khronos_validation.so']
                    // CardScan uses the CPU Interpreter API only. LiteRT 2.x
                    // also ships this optional GPU accelerator, which is not
                    // loaded by our scanner and needlessly expands the APK and
                    // native attack surface.
                    excludes += ['**/libLiteRtClGlAccelerator.so']
                }
            }
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            packaging {
                jniLibs {
                    // Release APKs optimize for download size. The package
                    // manager extracts the same 16-KiB-aligned libraries at
                    // install time, so scanner behavior and ABI coverage stay
                    // unchanged while LiteRT and OCR binaries are deflated.
                    useLegacyPackaging = true
                    excludes += ['**/libVkLayer_khronos_validation.so']
                    excludes += ['**/libLiteRtClGlAccelerator.so']
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Stripe's last portable CardScan model/runtime is vendored as a local,
    // telemetry-free Android module. It analyzes CameraX preview frames and
    // does not use Google Play Services or the Stripe SDK's analytics layer.
    implementation project(":stripe-cardscan-local")

    // Tesseract is retained only for expiry/name extraction from the single
    // preview crop that CardScan accepted. It never receives a live stream.
    implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
}
