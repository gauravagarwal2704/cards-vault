plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.stripe.android.mlcore.impl"
    compileSdk = 36

    defaultConfig {
        minSdk = 26
    }
}

dependencies {
    api project(":stripe-cardscan-ml-core-base")
    implementation "androidx.annotation:annotation:1.9.1"
    // Standalone, app-bundled LiteRT. Pin deliberately: this native runtime
    // executes the CardScan model and must be reviewed independently of Dart
    // dependencies. 2.2.0 is the current supported Google Maven release.
    implementation "com.google.ai.edge.litert:litert:2.2.0"
}
